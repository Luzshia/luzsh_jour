<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Journal 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="notebook-page">
        
        <!-- VISTA 1: EL MENÚ PRINCIPAL -->
        <div id="view-menu" class="section active">
            <h1>Mi Journal 2026</h1>
            <div class="main-menu">
                <button class="menu-btn" onclick="showSection('metas')"><span>🎯</span> Metas</button>
                <button class="menu-btn" onclick="showSection('habitos')"><span>🌿</span> Hábitos</button>
                <button class="menu-btn" onclick="showSection('todo')"><span>✅</span> To-Do</button>
                <button class="menu-btn" onclick="showSection('agenda')"><span>📅</span> Agenda</button>
            </div>
        </div>

        <div id="view-metas" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="back-btn" onclick="showSection('menu')">← Volver</button>
                <button id="btnMode" class="back-btn" onclick="toggleMetaMode()" style="border-color: var(--accent);">👁️ Ver</button>
            </div>
            <h1>🎯 Metas <span id="currentYearDisplay"></span></h1>
    
            <!-- Modo Edición -->
            <div id="editMode" class="note-area">
                <textarea id="metasInput" placeholder="Escribe tus metas (una por línea)..." oninput="saveMetas()"></textarea>
            </div>

            <!-- Modo Visualización -->
            <div id="viewMode" class="note-area" style="display: none;">
                <ul id="metasListDisplay" class="notebook-list"></ul>
            </div>
        </div>

        <!-- VISTA 3: SECCIÓN HÁBITOS (Habit Tracker) -->
        <div id="view-habitos" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>Habit Tracker</h1>
            <div class="habit-input">
                <input type="text" id="habitInput" placeholder="Nuevo hábito...">
                <button onclick="addHabit()">+</button>
            </div>
            <ul id="habitList"></ul>
        </div>

        <!-- VISTA 4: SECCIÓN TO-DO -->
        <div id="view-todo" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>To-Do List</h1>
            <p>Lista de tareas pendientes...</p>
        </div>

        <!-- VISTA 5: SECCIÓN AGENDA -->
        <div id="view-agenda" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>Agenda</h1>
            <p>Calendario y recordatorios...</p>
        </div>

    </div>

    <script>
        // --- 1. REGISTRO DEL SERVICE WORKER (Para que sea instalable) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.worker.register('./sw.js').catch(err => console.log(err));
            });
        }

        // --- 2. NAVEGACIÓN ENTRE SECCIONES ---
        function showSection(sectionName) {
            // Ocultamos todas las secciones
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            // Mostramos solo la que queremos
            if(sectionName === 'menu') {
                document.getElementById('view-menu').classList.add('active');
            } else {
                document.getElementById('view-' + sectionName).classList.add('active');
            }
        }

        // --- 3. LÓGICA DEL HABIT TRACKER ---
        let habits = JSON.parse(localStorage.getItem('myHabits')) || [];
        renderHabits();

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (input.value.trim() === '') return;

            const newHabit = {
                id: Date.now(),
                text: input.value,
                completed: false
            };

            habits.push(newHabit);
            saveAndRender();
            input.value = '';
        }

        function toggleHabit(id) {
            habits = habits.map(h => h.id === id ? {...h, completed: !h.completed} : h);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myHabits', JSON.stringify(habits));
            renderHabits();
        }

        function renderHabits() {
            const list = document.getElementById('habitList');
            if(!list) return; // Seguridad por si no estamos en la vista de hábitos
            list.innerHTML = habits.map(h => `
                <li class="habit-item ${h.completed ? 'done' : ''}" onclick="toggleHabit(${h.id})">
                    ${h.text}
                    <span>${h.completed ? '✅' : '⭕'}</span>
                </li>
            `).join('');
        }
        const year = new Date().getFullYear();
        document.getElementById('currentYearDisplay').innerText = year;

        // Cargar metas iniciales
        let metasRaw = localStorage.getItem('misMetas_' + year) || '';
        let metasTachadas = JSON.parse(localStorage.getItem('metasTachadas_' + year)) || [];
        document.getElementById('metasInput').value = metasRaw;

        function saveMetas() {
            const texto = document.getElementById('metasInput').value;
            localStorage.setItem('misMetas_' + year, texto);
        }

        function toggleMetaMode() {
            const editDiv = document.getElementById('editMode');
            const viewDiv = document.getElementById('viewMode');
            const btn = document.getElementById('btnMode');

            if (editDiv.style.display !== 'none') {
                // PASAR A MODO VER
                renderMetasVisual();
                editDiv.style.display = 'none';
                viewDiv.style.display = 'block';
                btn.innerText = '✍️ Editar';
            } else {
                // PASAR A MODO EDITAR
                editDiv.style.display = 'block';
                viewDiv.style.display = 'none';
                btn.innerText = '👁️ Ver';
            }
        }

        function renderMetasVisual() {
            const texto = document.getElementById('metasInput').value;
            const listaUI = document.getElementById('metasListDisplay');
    
            // Convertimos el texto en un array de líneas
            const lineas = texto.split('\n').filter(linea => linea.trim() !== '');
    
            listaUI.innerHTML = lineas.map((linea, index) => {
                const isxDone = metasTachadas.includes(linea);
                return `<li class="${isDone ? 'completed' : ''}" onclick="toggleStrike(this, '${linea.replace(/'/g, "\\'")}')">${linea}</li>`;
            }).join('');
        }

        function toggleStrike(elemento, textoLinea) {
            elemento.classList.toggle('completed');
    
            if (elemento.classList.contains('completed')) {
                metasTachadas.push(textoLinea);
            } else {
                metasTachadas = metasTachadas.filter(m => m !== textoLinea);
            }
    
            localStorage.setItem('metasTachadas_' + year, JSON.stringify(metasTachadas));
        }
    </script>
</body>
</html>
