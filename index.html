<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal Personal</title>
    <!-- Enlace al CSS (Estética) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dotted-bg">

    <!-- PANTALLA DE BLOQUEO -->
    <div id="lock-screen" class="overlay">
        <div class="lock-container">
            <h2>🔒 Privacidad</h2>
            
            <!-- Indicadores de PIN (puntos que se llenan) -->
            <div class="pin-display">
                <div class="pin-slot" id="slot-1"></div>
                <div class="pin-slot" id="slot-2"></div>
                <div class="pin-slot" id="slot-3"></div>
                <div class="pin-slot" id="slot-4"></div>
            </div>
            
            <!-- Teclado Numérico Propio -->
            <div class="numpad">
                <button type="button" class="num-btn" data-val="1">1</button>
                <button type="button" class="num-btn" data-val="2">2</button>
                <button type="button" class="num-btn" data-val="3">3</button>
                <button type="button" class="num-btn" data-val="4">4</button>
                <button type="button" class="num-btn" data-val="5">5</button>
                <button type="button" class="num-btn" data-val="6">6</button>
                <button type="button" class="num-btn" data-val="7">7</button>
                <button type="button" class="num-btn" data-val="8">8</button>
                <button type="button" class="num-btn" data-val="9">9</button>
                <button type="button" class="num-btn" id="btn-clear">C</button>
                <button type="button" class="num-btn" data-val="0">0</button>
                <button type="button" class="num-btn" id="btn-enter">✔</button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE LA APP -->
    <div class="app-wrapper">
        
        <main id="main-content">
            <!-- VISTA: MENÚ PRINCIPAL (Aquí es el único sitio donde sale el año) -->
            <section id="view-menu" class="view active">
                <header class="app-header">
                    <h1>Mi Journal <span id="year-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                <nav class="menu-nav">
                    <button class="nav-item" id="go-metas">🎯 Mis Metas</button>
                    <button class="nav-item" id="go-habitos">🌿 Mis Hábitos</button>
                    <button class="nav-item" id="go-todo">✅ To-Do List</button>
                    <button class="nav-item" id="go-agenda">📅 Mi Agenda</button>
                    <button class="nav-item" id="go-ciclo">🌸 Ciclo Menstrual</button>
                    <button class="nav-item" id="go-config">⚙️ Configuración</button>
                </nav>
            </section>


            <!-- VISTA: METAS -->
            <section id="view-metas" class="view">
                <header class="app-header">
                    <div class="header-top-nav">
                        <div class="menu-dots-container">
                            <button id="btn-metas-menu" class="dots-btn">···</button>
                            <div id="metas-dropdown" class="dropdown-content hidden">
                                <button id="opt-add-meta">🖋️ Añadir Meta</button>
                                <button id="opt-historial-metas">📜 Ver Historial</button>
                            </div>
                        </div>
                    </div>
                    <h1>Mis Metas <span id="meta-year-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <div id="historial-metas-container" class="hidden"></div>

                    <ul id="lista-metas" class="metas-list">
                        <!-- Solo lectura y tachado aquí -->
                    </ul>

                    <div id="input-container-meta" class="hidden">
                        <div class="input-fake-row">
                            <span id="next-number-meta"></span>
                            <input type="text" id="input-nueva-meta" placeholder="Escribir meta...">
                        </div>
                    </div>
                </div>
            </section> 
            
            
            <!-- VISTA: HÁBITOS -->
            <section id="view-habitos" class="view">
                <header class="app-header">
                    <div class="header-top-nav">
                        <div class="menu-dots-container">
                            <button id="btn-habitos-menu" class="dots-btn">···</button>
                            <div id="habitos-dropdown" class="dropdown-content hidden">
                                <button id="opt-add-habito">🖋️ Añadir Hábito</button>
                                <button id="opt-historial-habitos">📜 Ver Historial</button>
                            </div>
                        </div>
                    </div>
                    <h1>Mis Hábitos <span id="habit-month-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <!-- Input para nuevo hábito (oculto por defecto) -->
                    <div id="input-container-habito" class="hidden">
                        <div class="input-fake-row">
                            <input type="text" id="input-nuevo-habito" placeholder="Escribir nuevo hábito...">
                        </div>
                    </div>

                    <div id="historial-habitos-container" class="hidden"></div>

                    <div id="contenedor-habitos" class="habitos-grid">
                        <!-- Aquí se generarán los hábitos -->
                    </div>
                </div>
            </section>

            <!-- VISTA: TODO LIST -->
            <section id="view-todo" class="view">
                <header class="app-header">
                    <div class="header-top-nav">
                        <div class="menu-dots-container">
                            <button id="btn-todo-menu" class="dots-btn">···</button>
                            <div id="todo-dropdown" class="dropdown-content hidden">
                                <button id="opt-add-todo">🖋️ Añadir Tarea</button>
                                <button id="opt-clear-todo">🗑️ Borrar Completadas</button>
                            </div>
                        </div>
                    </div>
                    <h1>To-Do List</h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <!-- Input oculto por defecto -->
                    <div id="input-container-todo" class="hidden">
                        <div class="input-fake-row">
                            <input type="text" id="input-nueva-tarea" placeholder="¿Qué tienes pendiente?">
                        </div>
                    </div>

                    <ul id="lista-tareas" class="todo-list">
                        <!-- Las tareas se generarán aquí -->
                    </ul>
                </div>
            </section>


            <!-- VISTA: AGENDA -->
            <section id="view-agenda" class="view">
                <header class="app-header agenda-header">
                    <div class="agenda-title-group">
                        <h1>Mi Agenda</h1>
                        <span id="rango-semana-label"></span>
                    </div>
                    <div class="agenda-controls">
                        <button id="btn-semana-prev">◀</button>
                        <button id="btn-semana-next">▶</button>
                    </div>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <!-- Formulario de Eventos -->
                    <div class="config-group agenda-form">
                        <h3>📅 Nuevo Evento</h3>
                        <div class="agenda-inputs">
                            <input type="text" id="agenda-tarea" placeholder="¿Qué harás?">
                            <div class="input-row">
                                <input type="date" id="agenda-fecha">
                                <input type="time" id="agenda-hora">
                            </div>
                            <button id="btn-add-evento" class="config-item-btn btn-load">Añadir a la Agenda</button>
                        </div>
                    </div>

                    <!-- Vista Semanal Estilo 43586.jpg -->
                    <div id="semana-container" class="semana-grid">
                        <!-- Los 7 días se generarán aquí -->
                    </div>
                </div>
            </section>

            <section id="view-ciclo" class="view">
                <header class="app-header">
                    <h1>Ciclo Menstrual</h1>
                    <div class="header-line"></div>
                </header>

                <div class="content-body">
                    <!-- Formulario Diario -->
                    <div class="config-group">
                        <h3>📝 Registro del Día</h3>
                        <div class="input-row">
                            <input type="date" id="ciclo-fecha">
                            <label><input type="checkbox" id="ciclo-inicio-regla"> ¿Inicia periodo?</label>
                        </div>

                        <div class="ciclo-seccion">
                            <h4>🩸 Menstruación</h4>
                            <select id="ciclo-flujo"><option value="">Intensidad Flujo</option><option>Ligero</option><option>Medio</option><option>Fuerte</option></select>
                            <select id="ciclo-color"><option value="">Color</option><option>Rojo Brillante</option><option>Rojo Oscuro</option><option>Rosa/Marrón</option></select>
                        </div>

                        <div class="ciclo-seccion">
                            <h4>🏥 Salud y Energía</h4>
                            <div class="check-grid">
                                <label><input type="checkbox" id="check-pelvico"> Dolor Pélvico</label>
                                <label><input type="checkbox" id="check-migrana"> Migraña</label>
                                <label><input type="checkbox" id="check-sexo"> Actividad Sexual</label>
                            </div>
                            <input type="number" id="ciclo-sueno" placeholder="Horas de sueño">
                            <select id="ciclo-energia"><option value="">Energía</option><option>Alta</option><option>Media</option><option>Baja</option></select>
                            <select id="ciclo-digestion"><option value="">Digestión</option><option>Buena</option><option>Estreñimiento</option></select>
                        </div>

                        <div class="ciclo-seccion">
                            <h4>🧠 Ánimo</h4>
                            <div class="check-grid">
                                <label><input type="checkbox" id="check-libido"> Libido Alto</label>
                                <label><input type="checkbox" id="check-irritabilidad"> Irritabilidad</label>
                                <label><input type="checkbox" id="check-ansiedad"> Ansiedad</label>
                                <label><input type="checkbox" id="check-paz"> Paz</label>
                            </div>
                        </div>

                        <textarea id="ciclo-notas" placeholder="Notas de texto libre..."></textarea>
                        <button id="btn-guardar-ciclo" class="config-item-btn btn-save">Guardar Registro</button>
                    </div>

                    <!-- Historial por Tablas -->
                    <div id="historial-ciclos-tablas" class="history-section">
                        <h3>📊 Historial de Ciclos</h3>
                        <!-- Aquí se generarán las tablas -->
                    </div>
                </div>
            </section>

            <!-- VISTA: CONFIGURACIÓN -->
            <!-- VISTA: CONFIGURACIÓN -->
            <section id="view-config" class="view">
                <header class="app-header">
                    <h1>Configuración</h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="config-container">
                    <!-- Tema y Apariencia -->
                    <div class="config-group">
                        <h3>🎨 Apariencia</h3>
                        <button class="config-item-btn" id="btn-toggle-dark">🌓 Modo Oscuro (On/Off)</button>
                        <div class="config-item">
                            <span>Color de acento:</span>
                            <input type="color" id="color-picker" value="#2ecc71">
                        </div>
                    </div>

                    <!-- Seguridad -->
                    <div class="config-group">
                        <h3>🔒 Seguridad</h3>
                        <button class="config-item-btn" id="btn-change-pin">Cambiar PIN de acceso</button>
                    </div>

                    <!-- Datos -->
                    <div class="config-group">
                        <h3>💾 Datos y Backup</h3>
                        <button class="config-item-btn btn-save" id="btn-export">Guardar Copia de Seguridad</button>
                        <label for="import-file" class="config-item-btn btn-load">
                            Cargar Copia de Seguridad
                            <input type="file" id="import-file" accept=".json" style="display:none">
                        </label>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Enlace al Script (Lógica) -->
    <script src="script.js"></script>
</body>
</html>
