<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal Personal</title>
    <!-- Enlace al CSS (Estética) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dotted-bg">

    <!-- PANTALLA DE BLOQUEO -->
    <div id="lock-screen" class="overlay">
        <div class="lock-container">
            <h2>🔒 Privacidad</h2>
            
            <!-- Indicadores de PIN (puntos que se llenan) -->
            <div class="pin-display">
                <div class="pin-slot" id="slot-1"></div>
                <div class="pin-slot" id="slot-2"></div>
                <div class="pin-slot" id="slot-3"></div>
                <div class="pin-slot" id="slot-4"></div>
            </div>
            
            <!-- Teclado Numérico Propio -->
            <div class="numpad">
                <button type="button" class="num-btn" data-val="1">1</button>
                <button type="button" class="num-btn" data-val="2">2</button>
                <button type="button" class="num-btn" data-val="3">3</button>
                <button type="button" class="num-btn" data-val="4">4</button>
                <button type="button" class="num-btn" data-val="5">5</button>
                <button type="button" class="num-btn" data-val="6">6</button>
                <button type="button" class="num-btn" data-val="7">7</button>
                <button type="button" class="num-btn" data-val="8">8</button>
                <button type="button" class="num-btn" data-val="9">9</button>
                <button type="button" class="num-btn" id="btn-clear">C</button>
                <button type="button" class="num-btn" data-val="0">0</button>
                <button type="button" class="num-btn" id="btn-enter">✔</button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE LA APP -->
    <div class="app-wrapper">
        
        <main id="main-content">
            <!-- VISTA: MENÚ PRINCIPAL (Aquí es el único sitio donde sale el año) -->
            <section id="view-menu" class="view active">
                <header class="app-header">
                    <h1>Mi Journal <span id="year-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                <nav class="menu-nav">
                    <button class="nav-item" id="go-metas">🎯 Mis Metas</button>
                    <button class="nav-item" id="go-habitos">🌿 Mis Hábitos</button>
                    <button class="nav-item" id="go-todo">✅ To-Do List</button>
                    <button class="nav-item" id="go-agenda">📅 Mi Agenda</button>
                    <button class="nav-item" id="go-ciclo">🌸 Ciclo Menstrual</button>
                    <button class="nav-item" id="go-config">⚙️ Configuración</button>
                </nav>
            </section>

            <!-- VISTA: METAS -->
            <section id="view-metas" class="view">
                <header class="app-header">
                    <h1>Mis Metas <span id="meta-year-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <div class="input-group">
                        <input type="text" id="input-nueva-meta" placeholder="Escribe una meta anual...">
                        <button id="btn-add-meta">+</button>
                    </div>

                    <ul id="lista-metas" class="metas-list">
                        <!-- Las metas aparecerán aquí -->
                    </ul>

                    <div class="history-section">
                        <button class="config-item-btn" id="btn-ver-historial">📜 Ver Metas de Años Pasados</button>
                        <div id="historial-metas" class="hidden"></div>
                    </div>
                </div>
            </section>

            <!-- VISTA: HÁBITOS -->
            <section id="view-habitos" class="view">
                <header class="app-header">
                    <h1>Mis Hábitos <span id="habit-month-label"></span></h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <div class="input-group">
                        <input type="text" id="input-nuevo-habito" placeholder="Ej: Beber agua, Leer...">
                        <button id="btn-add-habito">+</button>
                    </div>

                    <div id="contenedor-habitos" class="habitos-grid">
                        <!-- Aquí se generarán las tarjetas de hábitos -->
                    </div>

                    <div class="history-section">
                        <button class="config-item-btn" id="btn-ver-historial-habitos">📜 Historial de Meses Pasados</button>
                        <div id="historial-habitos" class="hidden"></div>
                    </div>
                </div>
            </section>

            <!-- VISTA: TODO LIST -->
            <section id="view-todo" class="view">
                <header class="app-header">
                    <h1>To-Do List</h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <div class="input-group">
                        <input type="text" id="input-nueva-tarea" placeholder="¿Qué tienes pendiente?">
                        <button id="btn-add-tarea">+</button>
                    </div>

                    <div class="todo-controls">
                        <button id="btn-limpiar-completadas" class="btn-secondary">🗑️ Borrar completadas</button>
                    </div>

                    <ul id="lista-tareas" class="todo-list">
                        <!-- Las tareas se generarán aquí -->
                    </ul>
                </div>
            </section>

            <!-- VISTA: AGENDA -->
            <section id="view-agenda" class="view">
                <header class="app-header agenda-header">
                    <div class="agenda-title-group">
                        <h1>Mi Agenda</h1>
                        <span id="rango-semana-label"></span>
                    </div>
                    <div class="agenda-controls">
                        <button id="btn-semana-prev">◀</button>
                        <button id="btn-semana-next">▶</button>
                    </div>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body">
                    <!-- Formulario de Eventos -->
                    <div class="config-group agenda-form">
                        <h3>📅 Nuevo Evento</h3>
                        <div class="agenda-inputs">
                            <input type="text" id="agenda-tarea" placeholder="¿Qué harás?">
                            <div class="input-row">
                                <input type="date" id="agenda-fecha">
                                <input type="time" id="agenda-hora">
                            </div>
                            <button id="btn-add-evento" class="config-item-btn btn-load">Añadir a la Agenda</button>
                        </div>
                    </div>

                    <!-- Vista Semanal Estilo 43586.jpg -->
                    <div id="semana-container" class="semana-grid">
                        <!-- Los 7 días se generarán aquí -->
                    </div>
                </div>
            </section>

            <!-- VISTA: CICLO MENSTRUAL -->
            <section id="view-ciclo" class="view">
                <header class="app-header">
                    <h1>Ciclo Menstrual</h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="content-body cycle-form">
                    <!-- Selector de Fecha -->
                    <div class="config-group">
                        <label>Fecha de registro:</label>
                        <input type="date" id="ciclo-fecha-registro" class="full-input">
                    </div>

                    <!-- Biomarcadores -->
                    <div class="config-group">
                        <h3>🌡️ Biomarcadores</h3>
                        <div class="input-row">
                            <input type="number" id="ciclo-temp" step="0.01" placeholder="Temp. Basal">
                            <input type="time" id="ciclo-temp-hora">
                        </div>
                    </div>

                    <!-- Menstruación -->
                    <div class="config-group">
                        <h3>🩸 Menstruación</h3>
                        <select id="ciclo-flujo" class="full-input">
                            <option value="">Intensidad de flujo...</option>
                            <option value="Ninguno">Ninguno</option>
                            <option value="Manchado">Manchado (Spotting)</option>
                            <option value="Ligero">Ligero</option>
                            <option value="Moderado">Moderado</option>
                            <option value="Abundante">Abundante</option>
                        </select>
                        <select id="ciclo-color" class="full-input">
                            <option value="">Color de flujo...</option>
                            <option value="Rojo Brillante">Rojo Brillante</option>
                            <option value="Rojo Oscuro">Rojo Oscuro / Marrón</option>
                            <option value="Rosado">Rosado</option>
                        </select>
                    </div>

                    <!-- Salud y Síntomas -->
                    <div class="config-group">
                        <h3>🏥 Salud y Factores</h3>
                        <div class="checklist-grid" id="ciclo-salud-check">
                            <label><input type="checkbox" value="Dolor Pélvico"> Dolor Pélvico</label>
                            <label><input type="checkbox" value="Sensibilidad Pechos"> Sensibilidad Pechos</label>
                            <label><input type="checkbox" value="Hinchazón"> Hinchazón</label>
                            <label><input type="checkbox" value="Migraña"> Migraña</label>
                        </div>
                        <input type="text" id="ciclo-otros-salud" placeholder="Sueño, Energía, Digestión..." class="full-input">
                    </div>

                    <!-- Estilo de Vida e Intervenciones -->
                    <div class="config-group">
                        <h3>🧪 Factores de Intervención</h3>
                        <input type="text" id="ciclo-intervencion" placeholder="Alcohol, estrés, viajes, medicinas..." class="full-input">
                    </div>

                    <!-- Estado de Ánimo -->
                    <div class="config-group">
                        <h3>🧠 Estado de Ánimo</h3>
                        <input type="text" id="ciclo-animo" placeholder="Líbido, irritabilidad, ansiedad..." class="full-input">
                    </div>

                    <!-- Otros -->
                    <div class="config-group">
                        <h3>📝 Otros</h3>
                        <label><input type="checkbox" id="ciclo-sexual"> Actividad Sexual</label>
                        <textarea id="ciclo-notas" placeholder="Notas libres..." rows="3" class="full-input"></textarea>
                    </div>

                    <button id="btn-guardar-ciclo" class="config-item-btn btn-load">Guardar Registro del Día</button>
                    
                    <div id="historial-ciclo" class="history-list">
                        <!-- Aquí se verán los días guardados -->
                    </div>
                </div>
            </section>

            <!-- VISTA: CONFIGURACIÓN -->
            <section id="view-config" class="view">
                <header class="app-header">
                    <h1>Configuración</h1>
                    <div class="header-line"></div>
                </header>
                
                <div class="config-container">
                    <!-- Tema y Apariencia -->
                    <div class="config-group">
                        <h3>🎨 Apariencia</h3>
                        <button class="config-item-btn" id="btn-toggle-dark">🌓 Modo Oscuro (On/Off)</button>
                        <div class="config-item">
                            <span>Color de acento:</span>
                            <input type="color" id="color-picker" value="#2ecc71">
                        </div>
                    </div>

                    <!-- Seguridad -->
                    <div class="config-group">
                        <h3>🔒 Seguridad</h3>
                        <button class="config-item-btn" id="btn-change-pin">Cambiar PIN de acceso</button>
                    </div>

                    <!-- Datos -->
                    <div class="config-group">
                        <h3>💾 Datos y Backup</h3>
                        <button class="config-item-btn btn-save" id="btn-export">Guardar Copia de Seguridad</button>
                        <label for="import-file" class="config-item-btn btn-load">
                            Cargar Copia de Seguridad
                            <input type="file" id="import-file" accept=".json" style="display:none">
                        </label>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Enlace al Script (Lógica) -->
    <script src="script.js"></script>
</body>
</html>
