<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Journal 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="notebook-page">
        
        <!-- VISTA 1: EL MENÚ PRINCIPAL -->
        <div id="view-menu" class="section active">
            <h1>Mi Journal 2026</h1>
            <div class="main-menu">
                <button class="menu-btn" onclick="showSection('metas')"><span>🎯</span> Metas</button>
                <button class="menu-btn" onclick="showSection('habitos')"><span>🌿</span> Hábitos</button>
                <button class="menu-btn" onclick="showSection('todo')"><span>✅</span> To-Do</button>
                <button class="menu-btn" onclick="showSection('agenda')"><span>📅</span> Agenda</button>
            </div>
        </div>

        <div id="view-metas" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="back-btn" onclick="showSection('menu')">← Volver</button>
                <button id="btnMode" class="back-btn" onclick="toggleMetaMode()" style="border-color: var(--accent);">👁️ Ver</button>
            </div>
            <h1>🎯 Metas <span id="currentYearDisplay"></span></h1>
    
            <!-- Modo Edición -->
            <div id="editMode" class="note-area">
                <textarea id="metasInput" placeholder="Escribe tus metas (una por línea)..." oninput="saveMetas()"></textarea>
            </div>

            <!-- Modo Visualización -->
            <div id="viewMode" class="note-area" style="display: none;">
                <ul id="metasListDisplay" class="notebook-list"></ul>
            </div>
        </div>

        <!-- VISTA 3: SECCIÓN HÁBITOS (Habit Tracker) -->
        <div id="view-habitos" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>Habit Tracker</h1>
            <div class="habit-input">
                <input type="text" id="habitInput" placeholder="Nuevo hábito...">
                <button onclick="addHabit()">+</button>
            </div>
            <ul id="habitList"></ul>
        </div>

        <!-- VISTA 4: SECCIÓN TO-DO -->
        <div id="view-todo" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>To-Do List</h1>
            <p>Lista de tareas pendientes...</p>
        </div>

        <!-- VISTA 5: SECCIÓN AGENDA -->
        <div id="view-agenda" class="section">
            <button class="back-btn" onclick="showSection('menu')">← Volver</button>
            <h1>Agenda</h1>
            <p>Calendario y recordatorios...</p>
        </div>

    </div>

    <script>
        // --- 1. REGISTRO DEL SERVICE WORKER (Corregido) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registrado'))
                    .catch(err => console.log('Error en SW', err));
            });
        }

        // --- 2. VARIABLES GLOBALES ---
        const year = new Date().getFullYear();
        const metasInput = document.getElementById('metasInput');
        const yearDisplay = document.getElementById('currentYearDisplay');

        if(yearDisplay) yearDisplay.innerText = year;

        // Cargar datos guardados
        let metasTachadas = JSON.parse(localStorage.getItem('metasTachadas_' + year)) || [];
        if(metasInput) {
            metasInput.value = localStorage.getItem('misMetas_' + year) || '';
        }

        // --- 3. NAVEGACIÓN ---
        function showSection(sectionName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('view-' + sectionName);
            if(target) target.classList.add('active');
        }

        // --- 4. LÓGICA DE METAS (Híbrida) ---
        function saveMetas() {
            localStorage.setItem('misMetas_' + year, metasInput.value);
        }

        function toggleMetaMode() {
            const editDiv = document.getElementById('editMode');
            const viewDiv = document.getElementById('viewMode');
            const btn = document.getElementById('btnMode');

            if (editDiv.style.display !== 'none') {
                renderMetasVisual();
                editDiv.style.display = 'none';
                viewDiv.style.display = 'block';
                btn.innerText = '✍️ Editar';
            } else {
                editDiv.style.display = 'block';
                viewDiv.style.display = 'none';
                btn.innerText = '👁️ Ver';
            }
        }

        function renderMetasVisual() {
            const texto = metasInput.value;
            const listaUI = document.getElementById('metasListDisplay');
            
            // Separar por líneas y quitar espacios vacíos
            const lineas = texto.split('\n').filter(l => l.trim() !== '');
            
            listaUI.innerHTML = '';
            lineas.forEach((linea) => {
                const li = document.createElement('li');
                li.innerText = linea;
                if (metasTachadas.includes(linea)) li.classList.add('completed');
                
                li.onclick = function() {
                    this.classList.toggle('completed');
                    if (this.classList.contains('completed')) {
                        metasTachadas.push(linea);
                    } else {
                        metasTachadas = metasTachadas.filter(m => m !== linea);
                    }
                    localStorage.setItem('metasTachadas_' + year, JSON.stringify(metasTachadas));
                };
                listaUI.appendChild(li);
            });
        }
    </script>
</body>
</html>
