<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Journal Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA DE BLOQUEO -->
    <div id="lock-screen" class="lock-screen">
        <div class="lock-content">
            <h2>🔒 Privacidad</h2>
            <input type="password" id="pinInput" placeholder="Introduce PIN" maxlength="4">
            <button onclick="checkPin()">Entrar</button>
        </div>
    </div>

    <div class="container">
        <!-- NAVEGACIÓN FIJA SUPERIOR -->
        <header class="main-header">
            <h1 id="mainTitle">Mi Journal 2026</h1>
            <nav class="nav-menu">
                <button onclick="showSection('menu')">🏠 Inicio</button>
                <button onclick="showSection('habitos')">🌿 Habitos</button>
                <button onclick="showSection('ciclo')">🌸 Ciclo</button>
                <button onclick="showSection('ajustes')">⚙️</button>
            </nav>
        </header>

        <!-- SECCIÓN: MENÚ INICIO -->
        <section id="view-menu" class="section active">
            <div class="card-menu" onclick="showSection('metas')">🎯 Mis Metas</div>
            <div class="card-menu" onclick="showSection('todo')">✅ Tareas</div>
            <div class="card-menu" onclick="showSection('agenda')">📅 Agenda</div>
        </section>

        <!-- SECCIÓN: HÁBITOS -->
        <section id="view-habitos" class="section">
            <div class="section-header">
                <h2>Hábitos de Mayo</h2>
                <button onclick="openModal('habitModal')">+ Nuevo</button>
            </div>
            <div id="habitContainer"></div>
        </section>

        <!-- SECCIÓN: CICLO MENSTRUAL (NUEVA) -->
        <section id="view-ciclo" class="section">
            <h2>🌸 Registro de Ciclo</h2>
            <div class="ciclo-form">
                <input type="date" id="cicloDate">
                <div class="ciclo-grid">
                    <label><input type="checkbox" id="cSangrado"> 🩸 Sangrado</label>
                    <label><input type="checkbox" id="cRelaciones"> 👩‍❤️‍👨 Relaciones</label>
                </div>
                <select id="cEmocion">
                    <option value="">😊 Emoción...</option>
                    <option value="feliz">Feliz</option>
                    <option value="triste">Triste/Sensible</option>
                    <option value="irritable">Irritable</option>
                    <option value="ansiosa">Ansiosa</option>
                </select>
                <div class="ciclo-row">
                    <input type="number" id="cSueño" placeholder="💤 Horas sueño">
                    <input type="number" id="cEnergia" placeholder="⚡ Energía (1-5)">
                </div>
                <textarea id="cObs" placeholder="Observaciones..."></textarea>
                <button onclick="saveCicloData()" class="btn-save">Guardar Registro</button>
            </div>
            <div id="cicloHistory" class="history-list"></div>
        </section>

        <!-- SECCIÓN: AJUSTES -->
        <section id="view-ajustes" class="section">
            <h2>⚙️ Configuración</h2>
            <div class="ajuste-card">
                <h3>Seguridad</h3>
                <input type="password" id="newPin" placeholder="Nuevo PIN (4 dígitos)">
                <button onclick="changePin()">Cambiar Clave</button>
            </div>
            <div class="ajuste-card">
                <h3>Personalización</h3>
                <button onclick="toggleDarkMode()">Modo Oscuro/Claro 🌓</button>
                <input type="color" id="accentColor" onchange="changeAccent(this.value)">
            </div>
            <button onclick="borrarTodo()" class="btn-danger">⚠️ Borrar todos los datos</button>
        </section>

        <!-- OTROS (Metas, Todo, Agenda simplificados para no llenar el prompt) -->
        <section id="view-metas" class="section"><h2>🎯 Metas</h2><textarea id="metasInput" oninput="saveMetas()"></textarea></section>
        <section id="view-todo" class="section"><h2>✅ Tareas</h2><div id="todoList"></div></section>
    </div>

    <!-- MODAL HÁBITOS -->
    <div id="habitModal" class="modal">
        <div class="modal-content">
            <h3>Nuevo Hábito</h3>
            <input type="text" id="habitName" placeholder="Nombre del hábito">
            <button onclick="addHabit()">Añadir</button>
            <button onclick="closeModal('habitModal')">Cancelar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
