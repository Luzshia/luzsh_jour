<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Journal 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="notebook-page">
        
        <!-- VISTA 1: EL MENÚ PRINCIPAL -->
        <div id="view-menu" class="section active">
            <h1>Mi Journal 2026</h1>
            <div class="main-menu">
                <button class="menu-btn" onclick="showSection('metas')"><span>🎯</span> Metas</button>
                <button class="menu-btn" onclick="showSection('habitos')"><span>🌿</span> Hábitos</button>
                <button class="menu-btn" onclick="showSection('todo')"><span>✅</span> To-Do</button>
                <button class="menu-btn" onclick="showSection('agenda')"><span>📅</span> Agenda</button>
            </div>
        </div>

        <div id="view-metas" class="section">
            <!-- Cabecera a los extremos -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
                <button class="back-btn" onclick="window.history.back()">← Volver</button>
                <button id="btnMode" class="back-btn" onclick="toggleMetaMode()" style="border-color: var(--accent);">✍️ Editar</button>
            </div>

            <h1>🎯 Mis Metas <span id="currentYearDisplay"></span></h1>
            <!-- Modo Edición -->
            <div id="editMode" class="note-area" style="display: none;">
                <textarea id="metasInput" placeholder="Escribe tus metas (una por línea)..." oninput="saveMetas()"></textarea>
            </div>

            <!-- Modo Visualización -->
            <div id="viewMode" class="note-area">
                <ul id="metasListDisplay" class="notebook-list"></ul>
            </div>
        </div>

        <div id="view-habitos" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
        <button class="back-btn" onclick="window.history.back()">← Volver</button>
        <button id="btnHabitMode" class="back-btn" onclick="toggleHabitInput()" style="border-color: var(--accent);">➕ Nuevo</button>
            </div>

            <h1>🌿 Hábitos de <span id="monthDisplay"></span></h1>
            <p id="habitStats" style="text-align: center; font-family: sans-serif; opacity: 0.7; font-size: 0.9em; margin-bottom: 15px;"></p>

            <!-- Caja de entrada oculta por defecto -->
            <div id="habitInputArea" style="display: none; margin-bottom: 20px; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 10px;">
                <div class="habit-input">
                    <input type="text" id="habitInput" placeholder="Ej: Meditar, Leer...">
                    <button onclick="addHabit()">Añadir</button>
                </div>
            </div>

            <div id="habitContainer"></div>
        </div>

        <!-- VISTA 4: SECCIÓN TO-DO -->
        <div id="view-tareas" class="section">
            <!-- Cabecera con triple control -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
                <!-- Extremo Izquierdo -->
                <button class="back-btn" onclick="window.history.back()">← Volver</button>
                
                <!-- Extremo Derecho (Agrupados) -->
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button onclick="clearCompleted()" class="back-btn" style="border-color: #e07a5f; color: #e07a5f; padding: 5px 12px;">🧹</button>
                    <button id="btnTodoMode" class="back-btn" onclick="toggleTodoInput()" style="border-color: var(--accent);">➕ Nuevo</button>
                </div>
            </div>

            <h1>📝 Lista de Tareas</h1>
            
            <!-- Entrada oculta -->
            <div id="todoInputArea" style="display: none; margin-bottom: 20px; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 10px;">
                <div class="habit-input">
                    <input type="text" id="todoInput" placeholder="¿Qué tienes pendiente?">
                    <button onclick="addTodo()">Añadir</button>
                </div>
            </div>

            <div id="todoContainer" class="note-area">
                <ul id="todoList" class="notebook-list"></ul>
            </div>
        </div> <!-- AQUÍ TERMINA LA SECCIÓN CORRECTAMENTE -->

        <div id="view-agenda" class="section">
            <!-- Cabecera simétrica -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
                <button class="back-btn" onclick="window.history.back()">← Volver</button>
                
                <div style="display: flex; gap: 8px;">
                    <button id="btnViewMode" class="back-btn" onclick="toggleAgendaView()" style="border-color: #81b29a;">📅 Vista</button>
                    <button class="back-btn" onclick="toggleAgendaInput()" style="border-color: var(--accent);">➕ Nuevo</button>
                </div>
            </div>

            <h1>📅 Mi Agenda</h1>

            <!-- Formulario para Nuevo Evento (Oculto por defecto) -->
            <div id="agendaInputArea" style="display: none; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--accent);">
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="eventTitle" placeholder="Nombre de la actividad">
                    <div style="display: flex; gap: 5px;">
                        <input type="date" id="eventDate" style="flex: 2;">
                        <input type="time" id="eventTime" style="flex: 1;">
                    </div>
                    <button onclick="addEvent()" style="background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer;">Guardar Evento</button>
                </div>
            </div>

            <!-- Contenedores de Vistas -->
            <div id="calendarView" class="note-area"></div>
            <div id="listView" class="note-area" style="display: none;"></div>
        </div>

    </div>

    <script>
        // --- 1. REGISTRO DEL SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registrado'))
                    .catch(err => console.log('Error en SW', err));
            });
        }

        // --- 2. VARIABLES GLOBALES DE TIEMPO ---
        const ahora = new Date();
        const year = ahora.getFullYear();
        const mesActual = ahora.getMonth();
        const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        const storageKeyMetas = 'misMetas_' + year;
        const storageKeyTachadas = 'metasTachadas_' + year;
        const storageKeyHabitos = `myHabits_${year}_${mesActual}`;

        // --- 3. CARGA INICIAL ---
        document.addEventListener('DOMContentLoaded', () => {
            if(document.getElementById('currentYearDisplay')) 
                document.getElementById('currentYearDisplay').innerText = year;
            
            if(document.getElementById('monthDisplay')) 
                document.getElementById('monthDisplay').innerText = nombresMeses[mesActual];

            const metasInput = document.getElementById('metasInput');
            if(metasInput) {
                metasInput.value = localStorage.getItem(storageKeyMetas) || '';
                renderMetasVisual();
            }
            
            // Cargar datos iniciales
            renderHabits();
            renderTodos();
        });

        // --- 4. NAVEGACIÓN PRO (Soporta gestos del móvil) ---

        function showSection(sectionName, pushState = true) {
            let targetId = sectionName;
            if (sectionName === 'todo') targetId = 'tareas';

            // 1. Quitar 'active' de todas las secciones
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            // 2. Activar la sección destino
            const target = document.getElementById('view-' + targetId);
            if(target) {
                target.classList.add('active');
                
                // 3. Registrar el movimiento en el historial del teléfono
                // Solo lo hacemos si pushState es true (para evitar bucles infinitos)
                if (pushState) {
                    history.pushState({ section: sectionName }, "", "#" + sectionName);
                }

                // 4. Refrescar contenido
                if (targetId === 'tareas') renderTodos();
                if (targetId === 'habitos') renderHabits();
                if (targetId === 'agenda') renderAgenda();
            }
        }

        // --- ESCUCHAR EL GESTO DE REGRESAR DEL TELÉFONO ---
        window.onpopstate = function(event) {
            if (event.state && event.state.section) {
                // Si el historial tiene una sección guardada, vamos a ella
                showSection(event.state.section, false);
            } else {
                // Si no hay nada en el historial (llegamos al inicio), volvemos al menú
                showSection('menu', false);
            }
        };

        // Modificamos la carga inicial para que el menú sea el "punto cero"
        document.addEventListener('DOMContentLoaded', () => {
            // ... tus otras cargas de metas y hábitos ...
            
            // Guardamos el estado inicial del menú en el historial
            history.replaceState({ section: 'menu' }, "", "#menu");
        });

        // --- 5. LÓGICA DE METAS ---
        let metasTachadas = JSON.parse(localStorage.getItem(storageKeyTachadas)) || [];

        function saveMetas() {
            localStorage.setItem(storageKeyMetas, document.getElementById('metasInput').value);
        }

        function toggleMetaMode() {
            const editDiv = document.getElementById('editMode');
            const viewDiv = document.getElementById('viewMode');
            const btn = document.getElementById('btnMode');

            if (editDiv.style.display !== 'none') {
                renderMetasVisual();
                editDiv.style.display = 'none';
                viewDiv.style.display = 'block';
                btn.innerText = '✍️ Editar';
            } else {
                editDiv.style.display = 'block';
                viewDiv.style.display = 'none';
                btn.innerText = '👁️ Ver';
            }
        }

        function renderMetasVisual() {
            const texto = document.getElementById('metasInput').value;
            const listaUI = document.getElementById('metasListDisplay');
            if(!listaUI) return;
            
            const lineas = texto.split('\n').filter(l => l.trim() !== '');
            listaUI.innerHTML = '';
            
            lineas.forEach((linea) => {
                const li = document.createElement('li');
                li.innerText = linea;
                if (metasTachadas.includes(linea)) li.classList.add('completed');
                
                li.onclick = function() {
                    this.classList.toggle('completed');
                    if (this.classList.contains('completed')) {
                        metasTachadas.push(linea);
                    } else {
                        metasTachadas = metasTachadas.filter(m => m !== linea);
                    }
                    localStorage.setItem(storageKeyTachadas, JSON.stringify(metasTachadas));
                };
                listaUI.appendChild(li);
            });
        }

        // --- 6. LÓGICA DE HÁBITOS ---
        let habits = JSON.parse(localStorage.getItem(storageKeyHabitos)) || [];

        function toggleHabitInput() {
            const area = document.getElementById('habitInputArea');
            const btn = document.getElementById('btnHabitMode');
            const input = document.getElementById('habitInput');

            if (area.style.display === 'none') {
                area.style.display = 'block';
                btn.innerText = '❌ Cerrar';
                setTimeout(() => input.focus(), 100);
            } else {
                area.style.display = 'none';
                btn.innerText = '➕ Nuevo';
            }
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (input.value.trim() === '') return;

            const newHabit = {
                id: Date.now(),
                name: input.value,
                history: []
            };

            habits.push(newHabit);
            saveAndRenderHabits();
            input.value = '';
            toggleHabitInput();
        }

        function saveAndRenderHabits() {
            localStorage.setItem(storageKeyHabitos, JSON.stringify(habits));
            renderHabits();
        }

        function renderHabits() {
            const container = document.getElementById('habitContainer');
            const statsUI = document.getElementById('habitStats'); // El nuevo texto
            if(!container) return;
            
            const diasEnMes = new Date(year, mesActual + 1, 0).getDate();
            
            // CALCULAR ESTADÍSTICAS
            let totalChecks = 0;
            habits.forEach(h => totalChecks += h.history.length);
            const totalPosibles = habits.length * diasEnMes;
            const porcentaje = totalPosibles > 0 ? Math.round((totalChecks / totalPosibles) * 100) : 0;
            
            if(statsUI) {
                statsUI.innerText = habits.length > 0 ? `Progreso mensual: ${porcentaje}% (${totalChecks} marcas)` : "Añade un hábito para empezar";
            }

            // ... aquí sigue tu código actual de container.innerHTML = habits.map(...)
            container.innerHTML = habits.map(habit => `
                <div class="habit-card">
                    <div class="habit-header">
                        <span>${habit.name}</span>
                        <button onclick="deleteHabit(${habit.id})" class="delete-btn">🗑️</button>
                    </div>
                    <div class="dots-grid">
                        <div class="dot-label">L</div><div class="dot-label">M</div>
                        <div class="dot-label">X</div><div class="dot-label">J</div>
                        <div class="dot-label">V</div><div class="dot-label">S</div>
                        <div class="dot-label">D</div>
                        ${generarPuntos(habit, diasEnMes)}
                    </div>
                </div>
            `).join('');
        }

        function generarPuntos(habit, totalDias) {
            let html = '';
            const primerDiaDelMes = new Date(year, mesActual, 1);
            let diaSemanaInicio = primerDiaDelMes.getDay(); 
            if (diaSemanaInicio === 0) diaSemanaInicio = 7; 
            
            for (let h = 1; h < diaSemanaInicio; h++) {
                html += `<div class="dot-empty"></div>`;
            }
            for (let i = 1; i <= totalDias; i++) {
                const isChecked = habit.history.includes(i) ? 'checked' : '';
                html += `
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <div class="dot ${isChecked}" onclick="toggleDot(${habit.id}, ${i})"></div>
                        <span class="dot-label">${i}</span>
                    </div>
                `;
            }
            return html;
        }

        function toggleDot(habitId, dia) {
            const habit = habits.find(h => h.id === habitId);
            if (habit.history.includes(dia)) {
                habit.history = habit.history.filter(d => d !== dia);
            } else {
                habit.history.push(dia);
            }
            saveAndRenderHabits();
        }

        function deleteHabit(id) {
            if(confirm('¿Borrar este hábito?')) {
                habits = habits.filter(h => h.id !== id);
                saveAndRenderHabits();
            }
        }

        // --- 7. LÓGICA DE TO-DO LIST ---
        let todos = JSON.parse(localStorage.getItem('myTodos')) || [];

        // Función para mostrar/ocultar el input (Igual a la de hábitos)
        function toggleTodoInput() {
            const area = document.getElementById('todoInputArea');
            const btn = document.getElementById('btnTodoMode');
            const input = document.getElementById('todoInput'); // El input

            if (area.style.display === 'none') {
                area.style.display = 'block';
                btn.innerText = '❌ Cerrar';
                setTimeout(() => input.focus(), 100); // El pequeño retraso ayuda a que el móvil lo detecte
            } else {
                area.style.display = 'none';
                btn.innerText = '➕ Nuevo';
            }
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (input.value.trim() === '') return;

            const newTodo = {
                id: Date.now(),
                text: input.value,
                completed: false
            };

            todos.push(newTodo);
            saveAndRenderTodos();
            input.value = '';
            toggleTodoInput(); // Cierra el input automáticamente al añadir
        }

        function saveAndRenderTodos() {
            localStorage.setItem('myTodos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            const listUI = document.getElementById('todoList');
            if(!listUI) return;

            if (todos.length === 0) {
                listUI.innerHTML = '<p style="text-align:center; opacity:0.5; font-family: sans-serif;">No hay pendientes por ahora.</p>';
                return;
            }

            listUI.innerHTML = todos.map(todo => `
                <li class="${todo.completed ? 'completed' : ''}" onclick="toggleTodo(${todo.id})" style="display:flex; align-items:center; gap:10px; cursor:pointer; list-style:none; padding: 10px 0; border-bottom: 1px dotted #ccc;">
                    <div class="todo-check"></div>
                    <span style="${todo.completed ? 'text-decoration:line-through; opacity:0.6' : ''}">${todo.text}</span>
                </li>
            `).join('');
        }

        // ... (el resto de funciones toggleTodo y clearCompleted se quedan igual)

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if(todo) {
                todo.completed = !todo.completed;
                saveAndRenderTodos();
            }
        }

        function clearCompleted() {
            // Solo actuamos si hay tareas completadas para no molestar con alertas vacías
            const completadas = todos.filter(t => t.completed).length;
            
            if (completadas === 0) {
                alert("No hay tareas completadas para limpiar.");
                return;
            }

            if (confirm(`¿Quieres borrar las ${completadas} tareas terminadas?`)) {
                todos = todos.filter(t => !t.completed);
                saveAndRenderTodos();
            }
        }

        /* REEMPLAZA DESDE AQUÍ */
        let events = JSON.parse(localStorage.getItem('myEvents')) || [];
        let currentAgendaView = 'calendar'; 

        function toggleAgendaInput() {
            const area = document.getElementById('agendaInputArea');
            area.style.display = area.style.display === 'none' ? 'block' : 'none';
            if(area.style.display === 'block') document.getElementById('eventTitle').focus();
        }

        function toggleAgendaView() {
            const cal = document.getElementById('calendarView');
            const list = document.getElementById('listView');
            const btn = document.getElementById('btnViewMode');

            if (currentAgendaView === 'calendar') {
                currentAgendaView = 'list';
                cal.style.display = 'none';
                list.style.display = 'block';
                btn.innerText = '📖 Agenda';
            } else {
                currentAgendaView = 'calendar';
                cal.style.display = 'block';
                list.style.display = 'none';
                btn.innerText = '📅 Calendario';
            }
            renderAgenda();
        }

        function addEvent() {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;

            if (!title || !date) {
                alert("Por favor, pon al menos un nombre y una fecha.");
                return;
            }

            const newEvent = {
                id: Date.now(),
                title,
                date,
                time: time || 'Todo el día',
                completed: false
            };

            events.push(newEvent);
            localStorage.setItem('myEvents', JSON.stringify(events));
            document.getElementById('eventTitle').value = '';
            toggleAgendaInput();
            renderAgenda();
        }

        function renderAgenda() {
            const cal = document.getElementById('calendarView');
            const list = document.getElementById('listView');
            if (!cal || !list) return;
            currentAgendaView === 'calendar' ? renderCalendarView(cal) : renderListView(list);
        }

        /* REEMPLAZA DESDE AQUÍ */
        function renderCalendarView(container) {
            const y = (typeof year !== 'undefined') ? year : new Date().getFullYear();
            const m = (typeof mesActual !== 'undefined') ? mesActual : new Date().getMonth();
            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

            let html = `<div class="calendar-grid">`;
            diasSemana.forEach(d => html += `<div class="day-header">${d}</div>`);

            const firstDay = new Date(y, m, 1);
            const lastDay = new Date(y, m + 1, 0).getDate();
            // Ajuste para que empiece en Lunes
            let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            // Espacios mes anterior
            for (let i = 0; i < startOffset; i++) {
                html += `<div class="calendar-day other-month"></div>`;
            }

            // Días del mes
            for (let d = 1; d <= lastDay; d++) {
                const fechaStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const listaEventos = (typeof events !== 'undefined') ? events.filter(e => e.date === fechaStr) : [];
                
                // Máximo 2 etiquetas visibles para mantener el orden
                const etiquetasHtml = listaEventos.slice(0, 2).map(e => `
                    <div class="event-tag" title="${e.title}">${e.title}</div>
                `).join('');

                const mas = listaEventos.length > 2 ? `<div style="font-size:8px; color:#999; margin-top:2px;">+${listaEventos.length - 2}</div>` : '';

                html += `
                    <div class="calendar-day">
                        <span style="font-size:10px; font-weight:bold; margin-bottom:2px;">${d}</span>
                        <div style="width:100%; display:flex; flex-direction:column; gap:1px;">
                            ${etiquetasHtml}
                        </div>
                        ${mas}
                    </div>
                `;
            }
            
            html += `</div>`;
            container.innerHTML = html;
        }
        /* HASTA AQUÍ */

        function renderListView(container) {
            const y = (typeof year !== 'undefined') ? year : new Date().getFullYear();
            const m = (typeof mesActual !== 'undefined') ? mesActual : new Date().getMonth();
            const lastDay = new Date(y, m + 1, 0).getDate();
            const nombresDias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            
            let html = '<div style="display: flex; flex-direction: column; gap: 0;">';

            for (let d = 1; d <= lastDay; d++) {
                const fechaObj = new Date(y, m, d);
                const diaNombre = nombresDias[fechaObj.getDay()];
                const fechaStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                const eventosDia = (typeof events !== 'undefined') ? events.filter(e => e.date === fechaStr) : [];

                html += `
                    <div style="border-bottom: 1px solid rgba(0,0,0,0.05); padding: 12px 5px; display: flex; align-items: flex-start; gap: 15px;">
                        <div style="min-width: 45px; text-align: center; border-right: 1px solid var(--accent); padding-right: 10px;">
                            <div style="font-size: 1.1em; font-weight: bold; color: var(--text);">${d}</div>
                            <div style="font-size: 0.6em; text-transform: uppercase; opacity: 0.5;">${diaNombre}</div>
                        </div>
                        
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                           
${eventosDia.length > 0 ? eventosDia.map(e => `
    <div style="background: rgba(0,0,0,0.03); padding: 8px; border-radius: 8px; border-left: 3px solid ${e.completed ? '#81b29a' : '#7d7d7d'}; margin-bottom: 5px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span onclick="manageEvent(${e.id}, 'check')" style="cursor: pointer; font-size: 0.9em; color: #333; ${e.completed ? 'text-decoration: line-through; opacity: 0.4' : ''}">
                ${e.time !== 'Todo el día' && e.time ? `<b style="color:var(--accent)">${e.time}</b> ` : ''}${e.title}
            </span>
            <div style="display: flex; gap: 12px; margin-left: 10px;">
                <span onclick="event.stopPropagation(); manageEvent(${e.id}, 'reschedule')" style="cursor: pointer; font-size: 1em;">⏳</span>
                <span onclick="event.stopPropagation(); manageEvent(${e.id}, 'delete')" style="cursor: pointer; font-size: 1em;">🗑️</span>
            </div>
        </div>
    </div>
`).join('') : '<div style="opacity: 0.1; font-size: 0.75em; padding-top: 5px; letter-spacing: 1px;">............................................................</div>'}
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }
        /* HASTA AQUÍ */

        function manageEvent(id, action) {
            const index = events.findIndex(e => e.id === id);
            if (index === -1) return;
            if (action === 'check') {
                events[index].completed = !events[index].completed;
            } else if (action === 'delete') {
                if (confirm("¿Cancelar esta actividad?")) events.splice(index, 1);
            } else if (action === 'reschedule') {
                const nuevaFecha = prompt("Introduce la nueva fecha (AAAA-MM-DD):", events[index].date);
                if (nuevaFecha) events[index].date = nuevaFecha;
            }
            localStorage.setItem('myEvents', JSON.stringify(events));
            renderAgenda();
        }
        /* HASTA AQUÍ */
    </script>
</body>
</html>
